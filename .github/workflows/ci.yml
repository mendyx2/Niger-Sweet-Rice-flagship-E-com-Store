name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nsr
          POSTGRES_PASSWORD: nsr
          POSTGRES_DB: nsr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nsr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nsr:nsr@localhost:5432/nsr?schema=public
      NEXT_PUBLIC_SITE_URL: https://example.com
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      OPS_PASSWORD: ci-only-ops-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
