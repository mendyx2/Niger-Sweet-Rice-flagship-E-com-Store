name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nsr
          POSTGRES_PASSWORD: nsr
          POSTGRES_DB: nsr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nsr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nsr:nsr@localhost:5432/nsr?schema=public
      NEXT_PUBLIC_SITE_URL: https://example.com
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      HQ_OWNER_PHONES: "08011112222"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nsr
          POSTGRES_PASSWORD: nsr
          POSTGRES_DB: nsr_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nsr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://nsr:nsr@localhost:5432/nsr_e2e?schema=public
      DATABASE_URL: postgresql://nsr:nsr@localhost:5432/nsr_e2e?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3200
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --trace retain-on-failure
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: test-results/
